<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Chicken Club</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --black:#0F0E0C;--black-soft:#1A1916;--black-card:#201E1B;
  --red:#C0261A;--red-bright:#E03120;--red-dim:#7A1510;
  --beige:#E8D8B8;--beige-hi:#F2E8D0;--beige-dim:#B8A882;--beige-mid:#7A6E58;
  --border:rgba(232,216,184,.09);--border-red:rgba(192,38,26,.32);
  --r-sm:6px;--r-md:12px;--r-lg:18px;--r-xl:22px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Jost',sans-serif;background:var(--black);color:var(--beige);
  min-height:100dvh;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Abril Fatface',serif}

/* ── BANNER MESA ── */
.banner-mesa{display:none;background:var(--black-soft);border-bottom:1.5px solid var(--red-dim);padding:11px 16px;text-align:center;font-size:13px;color:var(--beige-dim);font-weight:500;letter-spacing:.02em}

/* ── HEADER ── */
.header{background:var(--black);border-bottom:1px solid var(--border);box-shadow:0 2px 0 var(--red-dim),0 6px 24px rgba(0,0,0,.8);position:sticky;top:0;z-index:100}
.header-inner{max-width:480px;margin:0 auto;padding:10px 16px 0}
.logo-row{display:flex;align-items:center;padding-bottom:10px}
.logo-img{height:52px;width:auto;object-fit:contain}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:7px 15px;border-radius:50px;border:1px solid var(--border-red);background:transparent;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;color:var(--beige-mid);cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn.active,.cat-btn:hover{background:var(--red);border-color:var(--red);color:var(--beige-hi)}

/* ── HERO ── */
.hero-strip{max-width:480px;margin:0 auto;padding:16px 16px 0;text-align:center}
.hero-strip .tagline{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:6px}
.hero-divider{display:flex;align-items:center;gap:10px;margin:6px 0 0}
.hero-divider::before,.hero-divider::after{content:'';flex:1;height:1px;background:var(--border-red)}
.hero-divider span{font-size:15px}

/* ── MAIN ── */
.main{max-width:480px;margin:0 auto;padding:8px 14px 110px}
.section-label{font-family:'Abril Fatface',serif;font-size:20px;color:var(--beige-hi);margin:26px 0 4px;scroll-margin-top:160px;display:flex;align-items:center;gap:10px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border-red)}

/* ── TARJETAS ── */
.product-card{background:var(--black-card);border-radius:var(--r-lg);border:1px solid var(--border);display:flex;overflow:hidden;margin-bottom:11px;transition:border-color .2s,transform .15s;animation:fadeUp .38s ease both}
.product-card:nth-child(2){animation-delay:.05s}
.product-card:nth-child(3){animation-delay:.10s}
.product-card:nth-child(4){animation-delay:.15s}
.product-card:hover{border-color:var(--border-red)}
.product-card:active{transform:scale(.985)}
.product-card::before{content:'';display:block;width:3px;background:var(--red);flex-shrink:0;border-radius:3px 0 0 3px}
.product-img{width:112px;flex-shrink:0;background:var(--black-soft);overflow:hidden;display:flex;align-items:center;justify-content:center}
.product-img img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.9) saturate(1.1);transition:transform .4s ease,filter .3s}
.product-card:hover .product-img img{transform:scale(1.07);filter:brightness(.98) saturate(1.15)}
.product-img-placeholder{font-size:40px;text-shadow:0 0 28px rgba(224,49,32,.5)}

/* Badge "pronto" para 24 alitas */
.badge-soon{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(192,38,26,.15);border:1px solid var(--border-red);
  border-radius:50px;padding:3px 10px;
  font-size:11px;font-weight:600;color:var(--beige-dim);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;
}

.product-info{flex:1;padding:13px 13px 13px 12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.product-name{font-family:'Abril Fatface',serif;font-size:15px;color:var(--beige-hi);line-height:1.2;margin-bottom:4px}
.product-desc{font-size:12px;color:var(--beige-mid);line-height:1.5;margin-bottom:10px;font-weight:300;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.product-footer{display:flex;align-items:center;justify-content:space-between}
.product-price{font-size:17px;font-weight:700;color:var(--beige);font-variant-numeric:tabular-nums}
.btn-add{width:34px;height:34px;border-radius:50%;background:var(--red);border:none;color:var(--beige-hi);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s;box-shadow:0 3px 12px rgba(192,38,26,.45)}
.btn-add:hover{background:var(--red-bright)}
.btn-add:active{transform:scale(.86)}
body.mode-mesa .btn-add{display:none}

/* ── CONFIGURADOR ── */
.config-overlay{position:fixed;inset:0;background:rgba(8,7,6,.82);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.config-overlay.open{opacity:1;pointer-events:all}
.config-sheet{background:var(--black-soft);border-radius:var(--r-xl) var(--r-xl) 0 0;border-top:2px solid var(--red);width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;padding:0 16px 40px;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);scrollbar-width:thin;scrollbar-color:var(--red-dim) transparent}
.config-overlay.open .config-sheet{transform:translateY(0)}
.config-sheet::-webkit-scrollbar{width:4px}
.config-sheet::-webkit-scrollbar-thumb{background:var(--red-dim);border-radius:4px}
.config-handle{width:40px;height:4px;background:var(--border-red);border-radius:4px;margin:14px auto 16px}
.config-header{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border-red);margin-bottom:18px}
.config-header-icon{font-size:30px;flex-shrink:0}
.config-header-text h3{font-size:18px;color:var(--beige-hi);line-height:1.1}
.config-header-text p{font-size:12px;color:var(--beige-mid);margin-top:3px}
.config-close-btn{margin-left:auto;flex-shrink:0;width:32px;height:32px;border-radius:50%;background:rgba(232,216,184,.08);border:1px solid rgba(232,216,184,.15);color:var(--beige-mid);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.config-close-btn:hover{background:rgba(192,38,26,.25);color:var(--beige-hi)}
.step-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.step-label::after{content:'';flex:1;height:1px;background:var(--border-red)}
.sauce-slots{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.sauce-slot{background:var(--black-card);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;transition:border-color .2s}
.sauce-slot.filled{border-color:var(--border-red)}
.sauce-slot-header{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer}
.sauce-slot-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--beige)}
.sauce-slot-num{width:22px;height:22px;border-radius:50%;background:var(--red);font-size:11px;font-weight:700;color:var(--beige-hi);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sauce-slot-chosen{font-size:12px;color:var(--beige-dim);text-align:right;max-width:150px;line-height:1.3}
.sauce-slot-chosen.ok{color:var(--beige)}
.sauce-chevron{font-size:12px;color:var(--beige-mid);margin-left:6px;transition:transform .2s;flex-shrink:0}
.sauce-slot.open .sauce-chevron{transform:rotate(180deg)}
.sauce-list{display:none;padding:0 10px 12px}
.sauce-slot.open .sauce-list{display:block}
.sauce-options-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sauce-opt{padding:10px 8px;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--black-soft);cursor:pointer;font-size:13px;color:var(--beige-mid);font-weight:500;text-align:center;line-height:1.25;transition:all .18s;display:flex;align-items:center;justify-content:center;width:100%}
.sauce-opt:hover{border-color:var(--border-red);color:var(--beige)}
.sauce-opt.selected{background:rgba(192,38,26,.18);border-color:var(--red);color:var(--beige-hi)}
.config-summary{background:var(--black-card);border:1px solid var(--border-red);border-radius:var(--r-md);padding:14px;margin-top:6px;margin-bottom:16px;display:none}
.config-summary.visible{display:block}
.config-summary h4{font-size:14px;color:var(--beige-hi);margin-bottom:10px}
.summary-line{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--beige-dim);margin-bottom:6px;line-height:1.4}
.summary-line span:first-child{color:var(--red);font-size:15px;flex-shrink:0}
.config-total-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.config-total-row span:first-child{font-size:13px;color:var(--beige-mid);font-weight:600}
.config-total-row span:last-child{font-size:18px;font-weight:700;color:var(--red-bright)}
.btn-add-config{width:100%;padding:15px;background:var(--red);border:none;border-radius:var(--r-md);color:var(--beige-hi);font-family:'Jost',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;box-shadow:0 4px 16px rgba(192,38,26,.4);letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-add-config:hover{background:var(--red-bright)}
.btn-add-config:active{transform:scale(.97)}
.btn-add-config:disabled{background:var(--black-card);color:var(--beige-mid);box-shadow:none;cursor:not-allowed;transform:none}

/* ── FAB ── */
.fab-cart{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) scale(0);z-index:200;background:var(--red);color:var(--beige-hi);border:none;border-radius:50px;padding:14px 22px;font-family:'Jost',sans-serif;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 6px 28px rgba(192,38,26,.55);transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .15s;white-space:nowrap}
.fab-cart.visible{transform:translateX(-50%) scale(1)}
.fab-cart:hover{background:var(--red-bright)}
.fab-badge{background:var(--beige-hi);color:var(--black);border-radius:50px;padding:2px 9px;font-size:13px;font-weight:700}
body.mode-mesa .fab-cart{display:none!important}

/* ── MODAL CARRITO ── */
.modal-overlay{position:fixed;inset:0;background:rgba(8,7,6,.78);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{background:var(--black-soft);border-radius:var(--r-lg) var(--r-lg) 0 0;border-top:2px solid var(--red-dim);width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;padding:0 16px 44px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border-red);border-radius:4px;margin:14px auto 18px}
.modal-title{font-family:'Abril Fatface',serif;font-size:20px;color:var(--beige-hi);margin-bottom:18px}
.cart-list{margin-bottom:18px}
.cart-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:14px;font-weight:600;color:var(--beige);display:block;margin-bottom:3px}
.cart-item-detail{font-size:11px;color:var(--beige-mid);line-height:1.5;font-weight:300}
.cart-item-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.cart-item-qty{display:flex;align-items:center;gap:8px}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border-red);background:transparent;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:700;transition:background .15s;line-height:1}
.qty-btn:hover{background:rgba(192,38,26,.15)}
.qty-num{width:20px;text-align:center;font-weight:600;font-size:14px;color:var(--beige-hi)}
.cart-item-subtotal{font-weight:700;font-size:14px;color:var(--beige)}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0 18px;font-size:17px;font-weight:700;color:var(--beige-hi)}
.cart-total-row span:last-child{color:var(--red-bright);font-size:20px}
.divider{border:none;border-top:1px solid var(--border)}
.empty-cart{text-align:center;padding:32px 0;color:var(--beige-mid);font-size:15px;font-weight:300}
.empty-cart-icon{font-size:44px;margin-bottom:10px;display:block}
.form-section{margin-top:18px}
.form-section h3{font-size:12px;font-weight:700;color:var(--beige-dim);margin-bottom:14px;letter-spacing:.1em;text-transform:uppercase}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--beige-mid);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.form-input{width:100%;padding:12px 14px;border:1px solid rgba(232,216,184,.14);border-radius:var(--r-sm);font-family:'Jost',sans-serif;font-size:15px;color:var(--beige);background:var(--black-card);outline:none;transition:border-color .2s}
.form-input::placeholder{color:var(--beige-mid)}
.form-input:focus{border-color:var(--red)}
.form-input.error{border-color:var(--red-bright)}
.payment-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-btn{padding:13px 10px;border-radius:var(--r-md);border:1px solid rgba(232,216,184,.14);background:var(--black-card);cursor:pointer;font-family:'Jost',sans-serif;font-size:14px;font-weight:500;color:var(--beige-mid);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s}
.pay-btn .pay-icon{font-size:22px}
.pay-btn.selected{border-color:var(--red);background:rgba(192,38,26,.14);color:var(--beige)}
.btn-whatsapp{width:100%;padding:16px;background:#25D366;border:none;border-radius:var(--r-md);color:#fff;font-family:'Jost',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;transition:background .15s,transform .1s;box-shadow:0 4px 16px rgba(37,211,102,.28);letter-spacing:.03em}
.btn-whatsapp:hover{background:#1FAD55}
.btn-whatsapp:active{transform:scale(.97)}
.btn-clear{width:100%;padding:12px;background:transparent;border:1px solid rgba(232,216,184,.1);border-radius:var(--r-md);color:var(--beige-mid);font-family:'Jost',sans-serif;font-size:14px;cursor:pointer;margin-top:10px;transition:border-color .2s,color .2s}
.btn-clear:hover{border-color:var(--red-dim);color:var(--red)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black-soft);border:1px solid var(--border-red);color:var(--beige);padding:10px 20px;border-radius:50px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── DETALLE AMPLIADO DEL PRODUCTO ── */
.product-card{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.product-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.product-card:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.detail-overlay{position:fixed;inset:0;background:rgba(20,10,7,.72);z-index:550;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s ease}
.detail-overlay.open{opacity:1;pointer-events:auto}
.detail-card{position:relative;width:min(560px,100%);max-height:90vh;overflow-y:auto;background:var(--black-card);color:var(--beige);border:1px solid var(--border-red);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.55);transform:scale(.96);transition:transform .2s ease;scrollbar-color:var(--beige-mid) var(--black-soft);scrollbar-width:thin}
.detail-card::-webkit-scrollbar{width:8px}.detail-card::-webkit-scrollbar-track{background:var(--black-soft)}.detail-card::-webkit-scrollbar-thumb{background:var(--beige-mid);border-radius:999px;border:2px solid var(--black-soft)}
.detail-overlay.open .detail-card{transform:scale(1)}
.detail-close{position:absolute;top:12px;right:12px;width:38px;height:38px;border:1px solid var(--border-red);border-radius:50%;background:rgba(15,14,12,.88);color:var(--beige-hi);font-size:18px;cursor:pointer;z-index:2}
.detail-image{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--beige-light,#eee2d3);border-radius:24px 24px 0 0}
.detail-image-placeholder{width:100%;aspect-ratio:4/3;display:none;align-items:center;justify-content:center;font-size:72px;background:var(--beige-light,#eee2d3);border-radius:24px 24px 0 0}
.detail-content{padding:24px;background:var(--black-card);border-top:1px solid var(--border)}
.detail-name{margin:0 0 10px;color:var(--beige-hi);font-family:'Abril Fatface',serif;font-size:28px;font-weight:400;line-height:1.12}
.detail-description{margin:0;color:var(--beige-mid);font-size:16px;font-weight:300;line-height:1.6}
.detail-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px}
.detail-price{color:var(--beige);font-size:24px;font-weight:800;white-space:nowrap}
.detail-action{border:0;border-radius:999px;background:var(--red);color:var(--beige-hi);padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(192,38,26,.4)}
.detail-action:active{transform:scale(.98)}
@media(max-width:600px){.detail-overlay{align-items:flex-end;padding:0}.detail-card{width:100%;max-height:92vh;border-radius:24px 24px 0 0;transform:translateY(24px)}.detail-overlay.open .detail-card{transform:translateY(0)}.detail-image,.detail-image-placeholder{aspect-ratio:16/11;border-radius:24px 24px 0 0}.detail-content{padding:20px}.detail-name{font-size:25px}.detail-description{font-size:15px}.detail-footer{align-items:stretch;flex-direction:column}.detail-action{width:100%}}
</style>
</head>
<body>

<div class="banner-mesa" id="bannerMesa">
  🍗 Menú Digital — Revisa nuestra variedad y pídele directamente a tu mesero
</div>

<header class="header">
  <div class="header-inner">
    <div class="logo-row">
      <img class="logo-img" src="imagenes/logo/logo.jpg" alt="The Chicken Club"/>
    </div>
    <div class="cats" id="catsContainer"></div>
  </div>
</header>

<div class="hero-strip">
  <span class="tagline">🔥 Pollo Fresco · Apanado al Momento · Mucho Sabor</span>
  <div class="hero-divider"><span>🍗</span></div>
</div>

<main class="main" id="mainContent"></main>

<button class="fab-cart" id="fabCart" aria-label="Ver carrito">
  🛒 Mi pedido <span class="fab-badge" id="fabCount">0</span>
</button>


<!-- DETALLE AMPLIADO DEL PRODUCTO -->
<div class="detail-overlay" id="detailOverlay" aria-hidden="true">
  <article class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detailName">
    <button class="detail-close" type="button" onclick="closeProductDetail()" aria-label="Cerrar detalle">✕</button>
    <img class="detail-image" id="detailImage" alt="">
    <div class="detail-image-placeholder" id="detailImagePlaceholder">🍽️</div>
    <div class="detail-content">
      <h3 class="detail-name" id="detailName"></h3>
      <p class="detail-description" id="detailDescription"></p>
      <div class="detail-footer">
        <span class="detail-price" id="detailPrice"></span>
        <button class="detail-action" id="detailAction" type="button" onclick="handleDetailAction()">Agregar al pedido</button>
      </div>
    </div>
  </article>
</div>
<!-- MODAL CONFIGURADOR -->
<div class="config-overlay" id="configOverlay">
  <div class="config-sheet">
    <div class="config-handle"></div>
    <div class="config-header">
      <div class="config-header-icon" id="configIcon">🍗</div>
      <div class="config-header-text">
        <h3 id="configTitle">Personaliza tu pedido</h3>
        <p id="configSubtitle">Elige tus salsas</p>
      </div>
      <button class="config-close-btn" onclick="closeConfigModal()" type="button">✕</button>
    </div>

const fmt = n=>'$'+n.toLocaleString('es-CO');

/* ── RENDER MENÚ ── */
function renderMenu(){

/* ── DETALLE AMPLIADO ── */
let detailProduct=null;
function openProductDetail(productId){
  const p=MENU.find(x=>x.id===productId);if(!p)return;
  detailProduct=p;
  const overlay=document.getElementById('detailOverlay');
  const img=document.getElementById('detailImage');
  const placeholder=document.getElementById('detailImagePlaceholder');
  document.getElementById('detailName').textContent=p.name;
  document.getElementById('detailDescription').textContent=p.desc;
  document.getElementById('detailPrice').textContent=fmt(p.price);
  if(p.img){
    img.src=p.img;img.alt=p.name;img.style.display='block';placeholder.style.display='none';
    img.onerror=()=>{img.style.display='none';placeholder.textContent=p.emoji||'🍽️';placeholder.style.display='flex'};
  }else{
    img.removeAttribute('src');img.style.display='none';placeholder.textContent=p.emoji||'🍽️';placeholder.style.display='flex';
  }
  const action=document.getElementById('detailAction');
  action.textContent=p.type==='config'?'Personalizar pedido':'Agregar al pedido';
  action.style.display=IS_MESA?'none':'block';
  overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  document.querySelector('.detail-close').focus();
}
function closeProductDetail(){
  const overlay=document.getElementById('detailOverlay');
  overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');
  document.body.style.overflow='';detailProduct=null;
}
function handleDetailAction(){
  if(!detailProduct||IS_MESA)return;
  const p=detailProduct;
  closeProductDetail();
  if(p.type==='config')openConfigModal(null,p.id);else addSimple(p.id);
}
document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeProductDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('detailOverlay').classList.contains('open'))closeProductDetail()});
function makeCard(p){
  const card=document.createElement('div');card.className='product-card';
  card.onclick=()=>openProductDetail(p.id);
  card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`Ver detalles de ${p.name}`);
  card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProductDetail(p.id)}};
  const imgWrap=document.createElement('div');imgWrap.className='product-img';
  if(p.img){
    const img=document.createElement('img');img.src=p.img;img.alt=p.name;img.loading='lazy';
    img.onerror=()=>{img.remove();const ph=document.createElement('div');ph.className='product-img-placeholder';ph.textContent=p.emoji;imgWrap.appendChild(ph)};
    imgWrap.appendChild(img);
  }else{
    // Tarjeta especial para 24 alitas (sin foto aún)
    const ph=document.createElement('div');ph.className='product-img-placeholder';
    ph.innerHTML='🍗<br><span style="font-size:9px;color:var(--beige-mid);font-family:Jost,sans-serif">Foto próx.</span>';
    ph.style.flexDirection='column';ph.style.gap='2px';ph.style.display='flex';ph.style.alignItems='center';ph.style.justifyContent='center';
    imgWrap.appendChild(ph);
  }
  const info=document.createElement('div');info.className='product-info';
  const soonBadge = p.soon ? `<div class="badge-soon">📸 Foto próximamente</div>` : '';
  const addBtn = !IS_MESA
    ? (p.type==='config'
        ? `<button class="btn-add" onclick="openConfigModal(event,'${p.id}')" aria-label="Personalizar ${p.name}">+</button>`
        : `<button class="btn-add" onclick="event.stopPropagation();addSimple('${p.id}')" aria-label="Añadir ${p.name}">+</button>`)
    : '';
  info.innerHTML=`
    ${soonBadge}
    <p class="product-name">${p.name}</p>
    <p class="product-desc">${p.desc}</p>
    <div class="product-footer">
      <span class="product-price">${fmt(p.price)}</span>
      ${addBtn}
    </div>`;
  card.appendChild(imgWrap);card.appendChild(info);return card;
}

function catScroll(cat,btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(!cat){window.scrollTo({top:0,behavior:'smooth'});return}
  const el=document.getElementById('cat-'+cat.replace(/\s+/g,'-'));
  if(!el)return;
  const headerH=document.querySelector('.header')?.offsetHeight||0;
  window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-headerH-16,behavior:'smooth'});
}

/* ── CONFIGURADOR ── */
function openConfigModal(e,productId){
  e&&e.stopPropagation();if(IS_MESA)return;
  const p=MENU.find(x=>x.id===productId);if(!p)return;
  cfg.product=p;
  cfg.slots=p.slots.map(slotDef=>{
    const chosen=slotDef.defaultSauceId ? slotDef.sauces.find(s=>s.id===slotDef.defaultSauceId) || null : null;
    return {chosen};
  });
  document.getElementById('configIcon').textContent=p.emoji;
  document.getElementById('configTitle').textContent=p.name;
  document.getElementById('configSubtitle').textContent=`${fmt(p.price)} · ${p.configPrompt||'Elige tus salsas'}`;
  renderConfigSlots();
  document.getElementById('configSummary').classList.remove('visible');
  checkCfgReady();
  document.getElementById('configOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeConfigModal(){
  document.getElementById('configOverlay').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('configOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('configOverlay'))closeConfigModal()});

function renderConfigSlots(){
  const body=document.getElementById('configBody');body.innerHTML='';
  cfg.product.slots.forEach((slotDef,idx)=>{
    const chosen=cfg.slots[idx]?.chosen||null;
    const slotEl=document.createElement('div');slotEl.className='sauce-slot'+(chosen?' filled':'');slotEl.id=`cfg-slot-${idx}`;
    const header=document.createElement('div');header.className='sauce-slot-header';header.onclick=()=>toggleCfgSlot(idx);
    const chosenText=chosen ? `${chosen.emoji ? chosen.emoji + ' ' : ''}${chosen.name}` : 'Sin elegir';
    const chosenClass=chosen ? 'sauce-slot-chosen ok' : 'sauce-slot-chosen';
    header.innerHTML=`<div class="sauce-slot-title"><span class="sauce-slot-num">${idx+1}</span>${slotDef.label}</div><div style="display:flex;align-items:center;gap:4px"><span class="${chosenClass}" id="cfg-chosen-${idx}">${chosenText}</span><span class="sauce-chevron">▼</span></div>`;
    slotEl.appendChild(header);
    const list=document.createElement('div');list.className='sauce-list';
    const grid=document.createElement('div');grid.className='sauce-options-grid';
    slotDef.sauces.forEach(s=>{
      const btn=document.createElement('button');btn.className='sauce-opt'+(chosen&&chosen.id===s.id?' selected':'');btn.type='button';
      btn.textContent=`${s.emoji ? s.emoji + ' ' : ''}${s.name}`;btn.onclick=()=>selectCfgSauce(idx,s,btn);grid.appendChild(btn);
    });
    list.appendChild(grid);slotEl.appendChild(list);body.appendChild(slotEl);
  });
  toggleCfgSlot(0);
}
function toggleCfgSlot(idx){
  document.querySelectorAll('.sauce-slot').forEach((el,i)=>{if(i===idx)el.classList.toggle('open');else el.classList.remove('open')});
  setTimeout(()=>document.getElementById(`cfg-slot-${idx}`)?.scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}
function selectCfgSauce(idx,sauce,clickedBtn){
  const slotEl=document.getElementById(`cfg-slot-${idx}`);
  slotEl.querySelectorAll('.sauce-opt').forEach(b=>b.classList.remove('selected'));
  clickedBtn.classList.add('selected');cfg.slots[idx].chosen=sauce;
  const ch=document.getElementById(`cfg-chosen-${idx}`);ch.textContent=`${sauce.emoji ? sauce.emoji + ' ' : ''}${sauce.name}`;ch.classList.add('ok');
  slotEl.classList.add('filled');
  const next=idx+1;if(next<cfg.slots.length)setTimeout(()=>toggleCfgSlot(next),280);
  checkCfgReady();
}
function checkCfgReady(){
  const ok=cfg.slots.every(s=>s.chosen!==null);
  document.getElementById('btnAddConfig').disabled=!ok;
  if(ok)updateCfgSummary();else document.getElementById('configSummary').classList.remove('visible');
}
function updateCfgSummary(){
  const sumEl=document.getElementById('configSummaryContent');
  sumEl.innerHTML=cfg.product.slots.map((slotDef,i)=>{
    const c=cfg.slots[i].chosen;
    return `<div class="summary-line"><span>${c.emoji}</span><span><strong style="color:var(--beige)">${slotDef.label}:</strong> ${c.name}</span></div>`;
  }).join('');
  document.getElementById('configTotalPrice').textContent=fmt(cfg.product.price);
  document.getElementById('configSummary').classList.add('visible');
}
function confirmConfig(){
  if(!cfg.product||cfg.slots.some(s=>!s.chosen))return;
  const uid='cfg_'+(++cartUidSeq);
  const detail=cfg.product.slots.map((slotDef,i)=>`${slotDef.label}: ${cfg.slots[i].chosen.name}`).join(' | ');
  cart[uid]={uid,type:'config',name:cfg.product.name,detail,price:cfg.product.price,qty:1,emoji:cfg.product.emoji};
  updateFAB();closeConfigModal();showToast(`${cfg.product.emoji} ${cfg.product.name} agregado`);
}

/* ── CARRITO ── */
function addSimple(id){
  if(IS_MESA)return;const p=MENU.find(x=>x.id===id);if(!p)return;
  if(cart[id])cart[id].qty++;else cart[id]={uid:id,type:'simple',...p,qty:1};
  updateFAB();showToast(`${p.emoji} ${p.name} agregado`);
}
function removeOne(uid){if(!cart[uid])return;if(--cart[uid].qty<=0)delete cart[uid];updateFAB();renderCartModal()}
function addOne(uid){if(!cart[uid])return;cart[uid].qty++;updateFAB();renderCartModal()}
function clearCart(){cart={};cartUidSeq=0;updateFAB();closeModal();showToast('Carrito vaciado')}
const cartTotal=()=>Object.values(cart).reduce((a,i)=>a+i.price*i.qty,0);
const cartCount=()=>Object.values(cart).reduce((a,i)=>a+i.qty,0);
function updateFAB(){
  document.getElementById('fabCount').textContent=cartCount();
  const fab=document.getElementById('fabCart');
  cartCount()>0&&!IS_MESA?fab.classList.add('visible'):fab.classList.remove('visible');
}
function renderCartModal(){
  const listEl=document.getElementById('cartList'),totalEl=document.getElementById('cartTotal');
  const items=Object.values(cart);listEl.innerHTML='';
  if(!items.length){
    listEl.innerHTML='<div class="empty-cart"><span class="empty-cart-icon">🛒</span>Tu carrito está vacío.<br>¡Pide algo delicioso!</div>';
    document.getElementById('formSection').style.display='none';document.getElementById('btnWhatsapp').style.display='none';
  }else{
    items.forEach(item=>{
      const row=document.createElement('div');row.className='cart-item';
      row.innerHTML=`<div class="cart-item-info"><span class="cart-item-name">${item.emoji} ${item.name}</span>${item.detail?`<span class="cart-item-detail">${item.detail}</span>`:''}</div><div class="cart-item-right"><div class="cart-item-qty"><button class="qty-btn" onclick="removeOne('${item.uid}')">−</button><span class="qty-num">${item.qty}</span><button class="qty-btn" onclick="addOne('${item.uid}')">+</button></div><span class="cart-item-subtotal">${fmt(item.price*item.qty)}</span></div>`;
      listEl.appendChild(row);
    });
    document.getElementById('formSection').style.display='block';document.getElementById('btnWhatsapp').style.display='flex';
  }
  totalEl.textContent=fmt(cartTotal());
}
document.getElementById('fabCart').addEventListener('click',openModal);
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal()});
function openModal(){renderCartModal();document.getElementById('modalOverlay').classList.add('open');document.body.style.overflow='hidden';isCartOpen=true}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');document.body.style.overflow='';isCartOpen=false}

/* ── PAGO ── */
function selectPay(m){
  selectedPay=m;
  document.getElementById('payEfectivo').classList.toggle('selected',m==='Efectivo');
  document.getElementById('payTransferencia').classList.toggle('selected',m==='Transferencia');
  document.getElementById('payEfectivo').style.outline='';document.getElementById('payTransferencia').style.outline='';
}

/* ── WHATSAPP ── */
function sendWhatsApp(){
  const nombre=document.getElementById('inputNombre').value.trim();
  const direccion=document.getElementById('inputDireccion').value.trim();
  const iN=document.getElementById('inputNombre'),iD=document.getElementById('inputDireccion');
  let ok=true;iN.classList.remove('error');iD.classList.remove('error');
  if(!nombre){iN.classList.add('error');ok=false}
  if(!direccion){iD.classList.add('error');ok=false}
  if(!selectedPay){document.getElementById('payEfectivo').style.outline='2px solid #E03120';document.getElementById('payTransferencia').style.outline='2px solid #E03120';ok=false}
  if(!cartCount())ok=false;
  if(!ok){showToast('Completa todos los campos ✏️');return}
  const detalle=Object.values(cart).map(i=>{let l=`- ${i.qty}x ${i.name} (${fmt(i.price)})`;if(i.detail)l+=`\n   ${i.detail}`;return l}).join('\n');
  const msg=`🍗 *THE CHICKEN CLUB* 🍗\n\n👤 Cliente: ${nombre}\n📍 Dirección: ${direccion}\n💳 Pago: ${selectedPay}\n🛒 Detalle:\n${detalle}\n\n💰 Total: ${fmt(cartTotal())}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank');
}

/* ── TOAST ── */
let tt;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(isCartOpen)closeModal();else closeConfigModal()}});
renderMenu();
</script>
</body>
</html>
