<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Chicken Club</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<div class="banner-mesa" id="bannerMesa">
  🍗 Menú Digital — Revisa nuestra variedad y pídele directamente a tu mesero
</div>

<header class="header">
  <div class="header-inner">
    <div class="logo-row">
      <img class="logo-img" src="imagenes/logo/logo.jpg" alt="The Chicken Club"/>
    </div>
    <div class="cats" id="catsContainer"></div>
  </div>
</header>

<div class="hero-strip">
  <span class="tagline">🔥 Pollo Fresco · Apanado al Momento · Mucho Sabor</span>
  <div class="hero-divider"><span>🍗</span></div>
</div>

<main class="main" id="mainContent"></main>

<button class="fab-cart" id="fabCart" aria-label="Ver carrito">
  🛒 Mi pedido <span class="fab-badge" id="fabCount">0</span>
</button>


<!-- DETALLE AMPLIADO DEL PRODUCTO -->
<div class="detail-overlay" id="detailOverlay" aria-hidden="true">
  <article class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detailName">
    <button class="detail-close" type="button" onclick="closeProductDetail()" aria-label="Cerrar detalle">✕</button>
    <img class="detail-image" id="detailImage" alt="">
    <div class="detail-image-placeholder" id="detailImagePlaceholder">🍽️</div>
    <div class="detail-content">
      <h3 class="detail-name" id="detailName"></h3>
      <p class="detail-description" id="detailDescription"></p>
      <div class="detail-footer">
        <span class="detail-price" id="detailPrice"></span>
        <button class="detail-action" id="detailAction" type="button" onclick="handleDetailAction()">Agregar al pedido</button>
      </div>
    </div>
  </article>
</div>
<!-- MODAL CONFIGURADOR -->
<div class="config-overlay" id="configOverlay">
  <div class="config-sheet">
    <div class="config-handle"></div>
    <div class="config-header">
      <div class="config-header-icon" id="configIcon">🍗</div>
      <div class="config-header-text">
        <h3 id="configTitle">Personaliza tu pedido</h3>
        <p id="configSubtitle">Elige tus salsas</p>
      </div>
      <button class="config-close-btn" onclick="closeConfigModal()" type="button">✕</button>
    </div>
    <div id="configBody"></div>
    <div class="config-summary" id="configSummary">
      <h4>📋 Tu selección</h4>
      <div id="configSummaryContent"></div>
      <div class="config-total-row">
        <span>Total</span>
        <span id="configTotalPrice">$0</span>
      </div>
    </div>
    <button class="btn-add-config" id="btnAddConfig" disabled onclick="confirmConfig()" type="button">
      Agregar al pedido
    </button>
  </div>
</div>

<!-- MODAL CARRITO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" role="dialog" aria-modal="true">
    <div class="modal-handle"></div>
    <h2 class="modal-title">🛒 Tu pedido</h2>
    <div class="cart-list" id="cartList"></div>
    <hr class="divider"/>
    <div class="cart-total-row"><span>Total</span><span id="cartTotal">$0</span></div>
    <section class="form-section" id="formSection">
      <h3>📋 Datos de entrega</h3>
      <div class="form-group">
        <label class="form-label" for="inputNombre">Nombre completo *</label>
        <input class="form-input" type="text" id="inputNombre" placeholder="Ej: Juan Pérez" autocomplete="name"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="inputDireccion">Dirección y barrio *</label>
        <input class="form-input" type="text" id="inputDireccion" placeholder="Ej: Cra 45 #23-10, El Poblado" autocomplete="street-address"/>
      </div>
      <div class="form-group">
        <label class="form-label">Método de pago *</label>
        <div class="payment-options">
          <button class="pay-btn" id="payEfectivo" onclick="selectPay('Efectivo')" type="button">
            <span class="pay-icon">💵</span>Efectivo
          </button>
          <button class="pay-btn" id="payTransferencia" onclick="selectPay('Transferencia')" type="button">
            <span class="pay-icon">📲</span>Transferencia
          </button>
        </div>
      </div>
    </section>
    <button class="btn-whatsapp" id="btnWhatsapp" onclick="sendWhatsApp()" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.122.553 4.111 1.518 5.84L.057 23.94l6.268-1.432A11.95 11.95 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.808 9.808 0 01-5.042-1.389l-.361-.214-3.724.851.867-3.624-.235-.371A9.818 9.818 0 012.182 12C2.182 6.578 6.578 2.182 12 2.182S21.818 6.578 21.818 12 17.422 21.818 12 21.818z"/></svg>
      Enviar pedido por WhatsApp
    </button>
    <button class="btn-clear" onclick="clearCart()" type="button">🗑️ Vaciar carrito</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>

</body>
</html>
